<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowToys - Segítő Játékok Különleges Gyermekeknek</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Fredoka:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- Alapbeállítások és Lágy Formák --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fredoka', sans-serif; /* Barátságosabb, kerekített betűtípus */
            scroll-behavior: smooth;
        }

        body {
            background-color: #f0f4f9;
            color: #2c3e50;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- Fejléc és Animált Logó --- */
        header {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        /* Ha a logó fölé viszed a kurzort, finoman megmozdul */
        .logo-container:hover {
            transform: scale(1.05) rotate(-2deg);
        }

        .logo-ring {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            position: relative;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
        }

        /* Szivárványos gyűrű */
        .logo-ring::before {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff7675, #fab1a0, #ffeaa7, #55efc4, #81ecec, #74b9ff, #a29bfe);
            z-index: -1;
            animation: rotateRing 6s linear infinite;
        }

        .logo-text {
            font-family: 'Dancing Script', cursive;
            font-size: 32px;
            color: #2c3e50;
            font-weight: bold;
            padding-bottom: 5px;
        }

        .brand-name {
            font-size: 26px;
            font-weight: 600;
            background: linear-gradient(45deg, #6c5ce7, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- Óriási Főoldal (Hero Szekció) --- */
        .hero {
            min-height: 100vh;
            background: radial-gradient(circle at top right, #e0f2fe 0%, #e0e7ff 50%, #f3e8ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 60px 20px;
            text-align: center;
            position: relative;
        }

        /* Kis dekoratív lebegő háttér-buborékok a részletgazdagságért */
        .hero::before, .hero::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            filter: blur(20px);
            z-index: 1;
            animation: floatBubble 8s ease-in-out infinite;
        }
        .hero::before { width: 150px; height: 150px; top: 20%; left: 10%; }
        .hero::after { width: 250px; height: 250px; bottom: 15%; right: 10%; animation-delay: 2s; }

        .hero-content {
            max-width: 850px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .hero h1 {
            font-size: 52px;
            color: #1e293b;
            margin-bottom: 25px;
            line-height: 1.2;
        }

        .hero p {
            font-size: 20px;
            color: #64748b;
            margin-bottom: 40px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Gombok elrendezése */
        .hero-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 16px 36px;
            border-radius: 50px; /* Teljesen kerekített gomb sarkok */
            text-decoration: none;
            font-weight: 600;
